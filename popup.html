<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 16px 18px;
        background: #1c1c1e;
        color: #fff;
        font-family: "Noto Sans KR", Arial, sans-serif;
        font-size: 13px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .row {
        margin: 12px 0;
        position: relative;
      }
      .row:hover {
        z-index: 10;
      }
      .help {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 15px;
        height: 15px;
        margin-left: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #ddd;
        font-size: 10px;
        font-weight: 700;
        cursor: help;
        vertical-align: middle;
      }
      .help::after {
        content: attr(data-tip);
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 6px;
        background: #000;
        color: #fff;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.5;
        text-align: left;
        white-space: normal;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.12s;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .help:hover::after {
        opacity: 1;
        visibility: visible;
      }
      .row > label {
        display: block;
        margin-bottom: 6px;
        color: #e6e6e6;
      }
      .row > label b {
        float: right;
        color: #ff5c5c;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #ff5c5c;
      }
      .check label {
        display: flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
      }
      input[type="checkbox"] {
        accent-color: #ff5c5c;
        width: 16px;
        height: 16px;
      }
      .hint {
        margin-top: 12px;
        color: #888;
        font-size: 11px;
        line-height: 1.5;
      }
      .balance-ctrl {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .balance-ctrl input[type="range"] {
        flex: 1;
      }
      .nudge {
        flex: none;
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .nudge:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      button {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .h1-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .close-btn {
        padding: 3px 7px;
        font-size: 13px;
        line-height: 1;
      }
      .close-btn:hover {
        background: rgba(255, 92, 92, 0.85);
      }
    </style>
  </head>
  <body>
    <h1>
      🎧 Audio Toolkit
      <span class="h1-right">
        <input type="checkbox" id="enabled" title="전체 On/Off" />
        <button id="close" class="close-btn" title="닫기">✕</button>
      </span>
    </h1>

    <div class="row">
      <label>볼륨 부스트 <span class="help" data-tip="영상 소리 자체가 너무 작을 때 사용하세요. 유튜브 기본 100%를 넘어 최대 200%까지 키웁니다.">?</span> <b id="boost-val">100%</b></label>
      <input type="range" id="boost" min="100" max="200" step="5" value="100" />
    </div>

    <div class="row">
      <label>좌우 밸런스 <span class="help" data-tip="소리가 한쪽으로 치우쳐 들릴 때 좌우 균형을 맞춥니다. 왼쪽/오른쪽 버튼으로 미세 조정할 수 있어요.">?</span> <b id="balance-val">중앙</b></label>
      <div class="balance-ctrl">
        <button class="nudge" id="bal-minus" title="왼쪽으로 5">−</button>
        <input type="range" id="balance" min="-100" max="100" step="5" value="0" />
        <button class="nudge" id="bal-plus" title="오른쪽으로 5">+</button>
      </div>
    </div>

    <div class="row check">
      <label><input type="checkbox" id="compressor" /> 컴프레서 (야간 모드) <span class="help" data-tip="큰 소리와 작은 소리의 차이가 클 때 켜세요. 광고·효과음의 볼륨 튐을 눌러 밤에도 편하게 들을 수 있습니다.">?</span></label>
    </div>

    <div class="row check">
      <label><input type="checkbox" id="mono" /> 모노 병합 <span class="help" data-tip="좌우 채널을 하나로 합칩니다. 한쪽 이어폰만 끼거나, 좌우 분리가 어색한 영상에서 유용합니다.">?</span></label>
    </div>

    <div class="row" style="text-align: right">
      <button id="reset">초기화</button>
    </div>

    <p class="hint">유튜브 재생 중인 탭에 실시간 적용됩니다. 플레이어 컨트롤바의 막대 아이콘으로도 조절할 수 있어요.</p>

    <script src="popup.js"></script>
  </body>
</html>
