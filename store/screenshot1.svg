<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Apple SD Gothic Neo','AppleGothic','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e9ebf0"/>
    </linearGradient>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a54"/>
      <stop offset="1" stop-color="#202027"/>
    </linearGradient>
    <clipPath id="pc"><rect x="190" y="190" width="900" height="470" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- 헤드라인 -->
  <text x="640" y="96" text-anchor="middle" font-size="42" font-weight="700" fill="#111318">버튼 하나로 편안하게 청취해 보세요</text>
  <text x="640" y="140" text-anchor="middle" font-size="21" fill="#5a5f6a">재생바의 이퀄라이저 버튼으로 야간 모드를 즉시 켜고 끄세요</text>

  <!-- 플레이어 그림자 + 화면 -->
  <rect x="190" y="200" width="900" height="470" rx="16" fill="#000000" opacity="0.14"/>
  <rect x="190" y="190" width="900" height="470" fill="url(#vid)" rx="16"/>

  <!-- 컨트롤바(플레이어 하단) -->
  <g clip-path="url(#pc)">
    <rect x="190" y="566" width="900" height="94" fill="#0b0b0d" opacity="0.74"/>
  </g>

  <!-- 진행바 -->
  <rect x="214" y="583" width="852" height="3.5" rx="1.75" fill="#ffffff" opacity="0.32"/>
  <rect x="214" y="583" width="300" height="3.5" rx="1.75" fill="#ff3b30"/>
  <circle cx="514" cy="584.5" r="7" fill="#ff3b30"/>

  <!-- 좌측 컨트롤 -->
  <!-- 재생 -->
  <polygon points="216,610 216,630 234,620" fill="#ffffff"/>
  <!-- 볼륨 -->
  <path d="M250 615 h6 l9 -7 v24 l-9 -7 h-6 z" fill="#ffffff"/>
  <path d="M270 613 a10 10 0 0 1 0 14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- 이퀄라이저 토글 버튼 (켜짐: 빨강) + 강조 링 -->
  <circle cx="303" cy="620" r="19" fill="#ffffff" opacity="0.08"/>
  <circle cx="303" cy="620" r="19" fill="none" stroke="#ff5c5c" stroke-width="2.2"/>
  <g fill="#ff5c5c">
    <rect x="290.5" y="616" width="3" height="8"  rx="1.5"/>
    <rect x="296"   y="612" width="3" height="16" rx="1.5"/>
    <rect x="301.5" y="608" width="3" height="24" rx="1.5"/>
    <rect x="307"   y="613" width="3" height="14" rx="1.5"/>
    <rect x="312.5" y="616.5" width="3" height="7" rx="1.5"/>
  </g>

  <!-- 시간 -->
  <text x="340" y="625" font-size="15" fill="#e9e9e9">3:42 / 1:00:38</text>

  <!-- 우측 컨트롤 -->
  <rect x="998" y="613" width="22" height="15" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1042" cy="620" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1042" cy="620" r="2.4" fill="#ffffff"/>
  <path d="M1066 610 h10 v10 M1066 630 h10 v-10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 툴팁 말풍선 -->
  <rect x="212" y="524" width="372" height="36" rx="9" fill="#101012"/>
  <polygon points="296,559 312,559 304,570" fill="#101012"/>
  <text x="398" y="547" text-anchor="middle" font-size="15" fill="#ffffff">컴프레서(야간 모드) 켜짐 — 클릭하여 끄기</text>

  <!-- 하단 캡션 -->
  <text x="640" y="726" text-anchor="middle" font-size="18" fill="#7b8090">볼륨 옆 이퀄라이저 아이콘 · 켜지면 빨간색으로 표시됩니다</text>
</svg>
